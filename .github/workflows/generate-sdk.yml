name: Generate Client SDK

# api.yaml の更新を検知してクライアント用 Kotlin SDK を自動生成し、
# GitHub Release への添付とクライアントリポジトリへの PR 作成を行う

on:
  push:
    branches: [ master ]
    paths:
      - 'api.yaml'

  # 手動実行を許可
  workflow_dispatch:

env:
  OPENAPI_GENERATOR_VERSION: '7.24.0'
  OPENAPI_GENERATOR_SHA256: '4b83ccc6fd43056c8c631cd0195e5100bd0550912502527bab09ac76152dab0c'
  SDK_GROUP_ID: info.nukoneko.kidspos
  SDK_ARTIFACT_ID: kidspos-sdk
  SDK_PACKAGE: info.nukoneko.kidspos.sdk
  CLIENT_REPO_OWNER: KidsPOSProject
  CLIENT_REPO_NAME: KidsPOS-for-Android
  CLIENT_SDK_DIR: sdk

jobs:
  generate-sdk:
    name: Generate Kotlin SDK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      sdk-version: ${{ steps.version.outputs.SDK_VERSION }}
      asset-id: ${{ steps.release.outputs.ASSET_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine SDK version
        id: version
        run: |
          VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
          SDK_VERSION="${VERSION}.${GITHUB_RUN_NUMBER}"
          API_VERSION=$(grep -oP 'const val API_VERSION = \K[0-9]+' src/main/kotlin/info/nukoneko/kidspos/server/service/StatusService.kt)
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "API_VERSION=$API_VERSION" >> "$GITHUB_OUTPUT"
          echo "Generating SDK version: $SDK_VERSION (apiVersion: $API_VERSION)"

      - name: Download OpenAPI Generator
        run: |
          curl -sSL -o openapi-generator-cli.jar \
            "https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/${OPENAPI_GENERATOR_VERSION}/openapi-generator-cli-${OPENAPI_GENERATOR_VERSION}.jar"
          echo "${OPENAPI_GENERATOR_SHA256}  openapi-generator-cli.jar" | sha256sum -c -

      - name: Generate Kotlin SDK
        run: |
          java -jar openapi-generator-cli.jar generate \
            -i api.yaml \
            -g kotlin \
            --library jvm-okhttp4 \
            -o build/sdk \
            --additional-properties=packageName=${SDK_PACKAGE},groupId=${SDK_GROUP_ID},artifactId=${SDK_ARTIFACT_ID},artifactVersion=${{ steps.version.outputs.SDK_VERSION }}

      - name: Archive SDK
        run: |
          cd build/sdk
          zip -qr "../../${SDK_ARTIFACT_ID}-kotlin-${{ steps.version.outputs.SDK_VERSION }}.zip" .

      - name: Upload SDK as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.SDK_ARTIFACT_ID }}-kotlin-${{ steps.version.outputs.SDK_VERSION }}
          path: ${{ env.SDK_ARTIFACT_ID }}-kotlin-${{ steps.version.outputs.SDK_VERSION }}.zip
          retention-days: 90

      - name: Create GitHub Release with SDK asset
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_VERSION: ${{ steps.version.outputs.SDK_VERSION }}
          API_VERSION: ${{ steps.version.outputs.API_VERSION }}
        run: |
          BODY=$(cat <<EOF
          ## KidsPOS Client SDK ${SDK_VERSION}

          api.yaml から自動生成された Kotlin クライアント SDK です。

          - apiVersion: ${API_VERSION}
          - 生成元コミット: ${GITHUB_SHA}
          - ジェネレーター: OpenAPI Generator ${OPENAPI_GENERATOR_VERSION} (kotlin / jvm-okhttp4)
          EOF
          )
          RELEASE_JSON=$(jq -n \
            --arg tag "sdk-v${SDK_VERSION}" \
            --arg name "Client SDK ${SDK_VERSION}" \
            --arg body "$BODY" \
            --arg sha "$GITHUB_SHA" \
            '{tag_name: $tag, target_commitish: $sha, name: $name, body: $body, draft: false, prerelease: false}')
          RELEASE_ID=$(curl -sSf -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "$RELEASE_JSON" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" | jq -r '.id')
          echo "Created release ID: $RELEASE_ID"
          ASSET_NAME="${SDK_ARTIFACT_ID}-kotlin-${SDK_VERSION}.zip"
          ASSET_ID=$(curl -sSf -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary "@${ASSET_NAME}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}" | jq -r '.id')
          echo "Uploaded asset ID: $ASSET_ID"
          echo "ASSET_ID=$ASSET_ID" >> "$GITHUB_OUTPUT"

  create-client-pr:
    name: Create PR on client repository
    runs-on: ubuntu-latest
    needs: generate-sdk

    env:
      SDK_VERSION: ${{ needs.generate-sdk.outputs.sdk-version }}
      ASSET_ID: ${{ needs.generate-sdk.outputs.asset-id }}

    steps:
      - name: Check GitHub App credentials
        env:
          SDK_APP_ID: ${{ secrets.SDK_APP_ID }}
          SDK_APP_PRIVATE_KEY: ${{ secrets.SDK_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$SDK_APP_ID" ] || [ -z "$SDK_APP_PRIVATE_KEY" ]; then
            echo "::warning::SDK_APP_ID / SDK_APP_PRIVATE_KEY が未設定のためクライアントリポジトリへの PR 作成をスキップします"
            echo "SKIP_PR=true" >> "$GITHUB_ENV"
          fi

      - name: Generate GitHub App installation token
        if: env.SKIP_PR != 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SDK_APP_ID }}
          private-key: ${{ secrets.SDK_APP_PRIVATE_KEY }}
          owner: ${{ env.CLIENT_REPO_OWNER }}
          repositories: ${{ env.CLIENT_REPO_NAME }}

      - name: Download SDK from release asset
        if: env.SKIP_PR != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSfL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o sdk.zip \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"

      - name: Clone client repository and update SDK
        if: env.SKIP_PR != 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone "https://x-access-token:${APP_TOKEN}@github.com/${CLIENT_REPO_OWNER}/${CLIENT_REPO_NAME}.git" client
          cd client
          DEFAULT_BRANCH=$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's|origin/||')
          echo "DEFAULT_BRANCH=$DEFAULT_BRANCH" >> "$GITHUB_ENV"
          BRANCH="update-sdk-${SDK_VERSION}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"
          rm -rf "${CLIENT_SDK_DIR}"
          mkdir -p "${CLIENT_SDK_DIR}"
          unzip -q ../sdk.zip -d "${CLIENT_SDK_DIR}"
          git add "${CLIENT_SDK_DIR}"
          if git diff --cached --quiet; then
            echo "::notice::SDK に変更がないため PR 作成をスキップします"
            echo "SKIP_PR=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update KidsPOS SDK to ${SDK_VERSION}"
          git push origin "$BRANCH"

      - name: Create pull request on client repository
        if: env.SKIP_PR != 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_BODY=$(cat <<EOF
          KidsPOS-Server の api.yaml 更新に伴い、Kotlin SDK を ${SDK_VERSION} に更新します。

          - 生成元: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          - SDK Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/sdk-v${SDK_VERSION}
          - この PR は GitHub Actions により自動作成されました
          EOF
          )
          PR_JSON=$(jq -n \
            --arg title "Update KidsPOS SDK to ${SDK_VERSION}" \
            --arg head "$BRANCH" \
            --arg base "$DEFAULT_BRANCH" \
            --arg body "$PR_BODY" \
            '{title: $title, head: $head, base: $base, body: $body}')
          PR_URL=$(curl -sSf -X POST \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "$PR_JSON" \
            "${GITHUB_API_URL}/repos/${CLIENT_REPO_OWNER}/${CLIENT_REPO_NAME}/pulls" | jq -r '.html_url')
          echo "::notice::クライアント PR を作成しました: $PR_URL"
