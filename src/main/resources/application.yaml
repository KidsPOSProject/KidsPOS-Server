spring:
  datasource:
    url: jdbc:sqlite:./kidspos.db
    driverClassName: org.sqlite.JDBC

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true

  jpa:
    properties:
      hibernate:
        # SQLite の JDBC ドライバは getGeneratedKeys を実装していないため last_insert_rowid() で採番値を読む
        jdbc:
          use_get_generated_keys: false
        id:
          new_generator_mappings=false: false
        temp:
          use_jdbc_metadata_defaults: false
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false
        show_sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
    # Disable open-in-view to avoid performance issues
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
  thymeleaf:
    mode: HTML

server:
  port: 8080
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:classpath:keystore/kidspos.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:kidspos123}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SSL_KEY_ALIAS:kidspos}

# Application-specific configuration
app:
  receipt:
    printer:
      host: ${RECEIPT_PRINTER_HOST:localhost}
      port: ${RECEIPT_PRINTER_PORT:9100}
      status-cache-seconds: ${RECEIPT_PRINTER_STATUS_CACHE_SECONDS:15}
      connect-timeout-millis: ${RECEIPT_PRINTER_CONNECT_TIMEOUT_MILLIS:3000}
  barcode:
    qr-size: ${QR_CODE_SIZE:200}
    pdf:
      margin: ${PDF_MARGIN:20}
      image-size: ${PDF_IMAGE_SIZE:100}
      warmup-on-startup: ${PDF_WARMUP_ON_STARTUP:true}
  network:
    allowed-ip-prefix: ${ALLOWED_IP_PREFIX:192.168.}
  security:
    encryption-key: ${ENCRYPTION_KEY:DefaultKidsPOSKey123!@#}
  system-time:
    auto-sync-enabled: ${SYSTEM_TIME_AUTO_SYNC_ENABLED:true}
    auto-sync-threshold-millis: ${SYSTEM_TIME_AUTO_SYNC_THRESHOLD_MILLIS:30000}
    auto-sync-cooldown-millis: ${SYSTEM_TIME_AUTO_SYNC_COOLDOWN_MILLIS:60000}
    backward-sync-window-millis: ${SYSTEM_TIME_BACKWARD_SYNC_WINDOW_MILLIS:300000}
  apk:
    upload-dir: ${APK_UPLOAD_DIR:./uploads/apk}
    max-file-size: ${APK_MAX_FILE_SIZE:104857600}

# OpenAPI/Swagger configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
  packages-to-scan: info.nukoneko.kidspos.server.controller.api
