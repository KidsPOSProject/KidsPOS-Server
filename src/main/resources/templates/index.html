<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout::base_header('ダッシュボード')}"></head>
<body>
<nav th:replace="~{layout::nav('top')}"></nav>
<main class="container">
    <div class="page-header">
        <div>
            <h1>KidsPOS 管理画面</h1>
            <p>売店管理システム</p>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">接続情報</div>
        <div class="card-body">
            <p class="text-muted mb-3" th:if="${hosts.isEmpty()}">ネットワーク接続が見つかりません</p>
            <div class="row g-3">
                <div class="col-12 col-md-6" th:each="host, hostStat : ${hosts}">
                    <p class="stat-label">IPアドレス</p>
                    <p class="stat-value"><code th:text="${host.address}"></code></p>
                    <p class="mb-2">
                        <a th:href="'http://' + ${host.address} + ':' + ${port}"
                           th:text="'http://' + ${host.address} + ':' + ${port}"></a>
                    </p>
                    <div th:id="'qrcode-' + ${hostStat.index}" class="qr-code"></div>
                </div>
            </div>
            <p class="text-muted small mb-0 mt-3" th:if="${!hosts.isEmpty()}">
                QRコードを端末で読み取ると、この管理画面に接続できます
            </p>
        </div>
    </div>

    <h2 class="h5 mb-3">メニュー</h2>
    <div class="row g-3">
        <div class="col-12 col-sm-6 col-lg-4">
            <a href="/items" class="card h-100 text-decoration-none text-body">
                <div class="card-body">
                    <h3 class="h6 mb-1">商品管理</h3>
                    <p class="text-muted small mb-0">商品の登録・編集・削除、バーコード印刷</p>
                </div>
            </a>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
            <a href="/stores" class="card h-100 text-decoration-none text-body">
                <div class="card-body">
                    <h3 class="h6 mb-1">店舗管理</h3>
                    <p class="text-muted small mb-0">店舗とプリンタの設定</p>
                </div>
            </a>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
            <a href="/sales" class="card h-100 text-decoration-none text-body">
                <div class="card-body">
                    <h3 class="h6 mb-1">売上管理</h3>
                    <p class="text-muted small mb-0">売上データの確認</p>
                </div>
            </a>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
            <a href="/reports/sales" class="card h-100 text-decoration-none text-body">
                <div class="card-body">
                    <h3 class="h6 mb-1">売上レポート</h3>
                    <p class="text-muted small mb-0">PDF・Excelでダウンロード</p>
                </div>
            </a>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
            <a href="/apk" class="card h-100 text-decoration-none text-body">
                <div class="card-body">
                    <h3 class="h6 mb-1">APK管理</h3>
                    <p class="text-muted small mb-0">アプリのバージョン管理・配布</p>
                </div>
            </a>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
            <a href="/logs" class="card h-100 text-decoration-none text-body">
                <div class="card-body">
                    <h3 class="h6 mb-1">ログ</h3>
                    <p class="text-muted small mb-0">直近のエラーログを確認</p>
                </div>
            </a>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
            <a href="/ip" class="card h-100 text-decoration-none text-body">
                <div class="card-body">
                    <h3 class="h6 mb-1">接続情報</h3>
                    <p class="text-muted small mb-0">ホスト名・IPアドレスとQRコード</p>
                </div>
            </a>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
            <a href="/settings" class="card h-100 text-decoration-none text-body">
                <div class="card-body">
                    <h3 class="h6 mb-1">システム設定</h3>
                    <p class="text-muted small mb-0">各種設定の変更</p>
                </div>
            </a>
        </div>
    </div>
</main>
<footer th:replace="~{layout::footer}"></footer>
<th:block th:replace="~{layout::qrcode_scripts}"></th:block>
<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function() {
        /*[# th:each="host,hostStat : ${hosts}"]*/
        new QRCode(document.getElementById('qrcode-[(${hostStat.index})]'), {
            text: 'http://[(${host.address})]:[(${port})]',
            width: 150,
            height: 150,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
        /*[/]*/
    });
    /*]]>*/
</script>
</body>
</html>
