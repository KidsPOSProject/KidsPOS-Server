<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout::base_header(${title})}"></head>
<body>
<nav th:replace="~{layout::nav('items')}"></nav>
<main class="container">
    <div class="page-header">
        <div>
            <h1>商品管理</h1>
        </div>
        <a href="/items/new" class="btn btn-primary">新規作成</a>
    </div>

    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <a id="printSelected" class="btn btn-outline-secondary btn-sm disabled" role="button"
           aria-disabled="true" href="/api/item/barcode-pdf/selected">選択印刷</a>
        <a id="downloadPdf" class="btn btn-outline-secondary btn-sm" role="button"
           href="/api/item/barcode-pdf?showBorders=false">PDF出力</a>
        <span id="selectedCount" class="text-muted small">未選択</span>
        <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="showBorders">
            <label class="form-check-label" for="showBorders">罫線表示</label>
        </div>
        <a class="btn btn-outline-secondary btn-sm" href="/">戻る</a>
    </div>

    <div class="table-responsive">
        <table id="content" class="table table-striped table-hover" data-datatable>
            <thead>
                <tr>
                    <th width="50" class="no-sort">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="selectAll" title="全選択">
                        </div>
                    </th>
                    <th>ID</th>
                    <th>商品名</th>
                    <th>バーコード</th>
                    <th>値段</th>
                    <th width="180" class="no-sort">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item: ${data}">
                    <td>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input item-checkbox"
                                   th:data-id="${item.id}"
                                   th:data-barcode="${item.barcode}"
                                   th:data-name="${item.name}"
                                   th:data-price="${item.price}">
                        </div>
                    </td>
                    <td th:text="${item.id}"></td>
                    <td>
                        <strong th:text="${item.name}"></strong>
                    </td>
                    <td>
                        <code th:text="${item.barcode}"></code>
                    </td>
                    <td>
                        <strong>¥<span th:text="${#numbers.formatInteger(item.price, 1, 'COMMA')}"></span></strong>
                    </td>
                    <td>
                        <div class="d-flex gap-2">
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/items/{id}/edit(id=${item.id})}">編集</a>
                            <form th:action="@{/items/{id}/delete(id=${item.id})}" method="post"
                                  th:data-confirm-delete="${item.name}" class="d-inline">
                                <button type="submit" class="btn btn-outline-danger btn-sm">削除</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{layout::footer}"></footer>
<th:block th:replace="~{layout::table_scripts}"></th:block>
<script>
/*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function () {
            const table = document.getElementById('content');
            const selectAllCheckbox = document.getElementById('selectAll');
            const printLink = document.getElementById('printSelected');
            const downloadPdfLink = document.getElementById('downloadPdf');
            const showBordersCheckbox = document.getElementById('showBorders');
            const selectedCountLabel = document.getElementById('selectedCount');

            // DataTables はページ外の行を DOM から外すため、選択状態は DOM ではなく Set で保持する
            const selectedIds = new Set();
            const allIds = Array.prototype.map.call(
                table.querySelectorAll('.item-checkbox'),
                function (checkbox) { return checkbox.dataset.id; }
            );

            table.addEventListener('change', function (event) {
                const checkbox = event.target;
                if (!checkbox.classList.contains('item-checkbox')) {
                    return;
                }
                if (checkbox.checked) {
                    selectedIds.add(checkbox.dataset.id);
                } else {
                    selectedIds.delete(checkbox.dataset.id);
                }
                update();
            });

            selectAllCheckbox.addEventListener('change', function () {
                selectedIds.clear();
                if (this.checked) {
                    allIds.forEach(function (id) { selectedIds.add(id); });
                }
                update();
            });

            showBordersCheckbox.addEventListener('change', update);

            printLink.addEventListener('click', function (event) {
                if (selectedIds.size === 0) {
                    event.preventDefault();
                }
            });

            function syncVisibleCheckboxes() {
                table.querySelectorAll('.item-checkbox').forEach(function (checkbox) {
                    checkbox.checked = selectedIds.has(checkbox.dataset.id);
                });
            }

            function update() {
                syncVisibleCheckboxes();

                const total = allIds.length;
                const count = selectedIds.size;
                selectAllCheckbox.checked = total > 0 && count === total;
                selectAllCheckbox.indeterminate = count > 0 && count < total;
                selectedCountLabel.textContent = count > 0 ? count + ' 件選択中' : '未選択';

                const showBorders = showBordersCheckbox.checked;
                downloadPdfLink.href = '/api/item/barcode-pdf?showBorders=' + showBorders;

                if (count > 0) {
                    printLink.href = '/api/item/barcode-pdf/selected?showBorders=' + showBorders +
                        '&ids=' + Array.from(selectedIds).join(',');
                    printLink.classList.remove('disabled');
                    printLink.setAttribute('aria-disabled', 'false');
                } else {
                    printLink.removeAttribute('href');
                    printLink.classList.add('disabled');
                    printLink.setAttribute('aria-disabled', 'true');
                }
            }

            if (typeof jQuery !== 'undefined') {
                jQuery(table).on('draw.dt', syncVisibleCheckboxes);
            }

            update();
        });
/*]]>*/
</script>
</body>
</html>
