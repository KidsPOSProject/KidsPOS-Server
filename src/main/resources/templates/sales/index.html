<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout::base_header(${title})}"></head>
<body>
<nav th:replace="~{layout::nav('sales')}"></nav>
<main class="container">
    <div class="page-header">
        <div>
            <h1>売上管理</h1>
        </div>
        <a class="btn btn-primary" href="/reports/sales">レポート・エクスポート</a>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-6 col-md-3">
            <div class="card">
                <div class="card-body">
                    <p class="stat-label">本日の売上</p>
                    <p class="stat-value">¥<span th:text="${#numbers.formatInteger(stats.totalAmount, 1, 'COMMA')}"></span></p>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card">
                <div class="card-body">
                    <p class="stat-label">本日の取引数</p>
                    <p class="stat-value"><span th:text="${stats.salesCount}"></span>件</p>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card">
                <div class="card-body">
                    <p class="stat-label">平均単価</p>
                    <p class="stat-value">¥<span th:text="${#numbers.formatInteger(stats.averageAmount, 1, 'COMMA')}"></span></p>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card">
                <div class="card-body">
                    <p class="stat-label">前日比</p>
                    <p class="stat-value" th:if="${stats.changeRatio == null}">
                        <span class="text-muted">-</span>
                    </p>
                    <p class="stat-value"
                       th:if="${stats.changeRatio != null}"
                       th:classappend="${stats.changeRatio >= 0} ? 'text-success' : 'text-danger'">
                        <span th:text="${(stats.changeRatio >= 0 ? '+' : '') + #numbers.formatDecimal(stats.changeRatio * 100, 1, 1)}"></span>%
                    </p>
                    <small class="text-muted">
                        前日 ¥<span th:text="${#numbers.formatInteger(stats.previousAmount, 1, 'COMMA')}"></span>
                    </small>
                </div>
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table id="content" class="table table-striped table-hover" data-datatable>
            <thead>
                <tr>
                    <th>取引ID</th>
                    <th>店舗</th>
                    <th>数量</th>
                    <th>合計金額</th>
                    <th>受取金額</th>
                    <th>お釣り</th>
                    <th>日時</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="sale: ${data}">
                    <td>
                        <a th:href="@{/sales/{id}(id=${sale.id})}">
                            #<span th:text="${sale.id}"></span>
                        </a>
                    </td>
                    <td>
                        <span
                              th:text="${storeNames.containsKey(sale.storeId)} ? ${storeNames.get(sale.storeId)} : ${'店舗' + sale.storeId}"></span>
                    </td>
                    <td>
                        <strong th:text="${sale.quantity}"></strong>
                    </td>
                    <td>
                        <strong>¥<span th:text="${#numbers.formatInteger(sale.amount, 1, 'COMMA')}"></span></strong>
                    </td>
                    <td>
                        ¥<span th:text="${#numbers.formatInteger(sale.deposit, 1, 'COMMA')}"></span>
                    </td>
                    <td>
                        ¥<span th:text="${#numbers.formatInteger(sale.deposit - sale.amount, 1, 'COMMA')}"></span>
                    </td>
                    <td>
                        <span th:if="${sale.createdAt != null}"
                              th:text="${#dates.format(sale.createdAt, 'yyyy/MM/dd HH:mm')}"></span>
                        <span th:if="${sale.createdAt == null}" class="text-muted">-</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <a class="btn btn-outline-secondary" href="/">戻る</a>
    </div>
</main>
<footer th:replace="~{layout::footer}"></footer>
<th:block th:replace="~{layout::table_scripts}"></th:block>
</body>
</html>
