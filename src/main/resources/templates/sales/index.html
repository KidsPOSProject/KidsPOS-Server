<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout::base_header(${title})}"></head>
<body>
<div th:replace="~{layout::nav('sales')}"></div>

<div class="main-container">
    <div class="container-wrapper">
        <div class="content-area">
            <div class="container-fluid mt-3">
                <div class="row">
                    <div class="col-12">
                        <div class="card-modern">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <h1 class="mb-0">
                                        <i class="fas fa-chart-line text-warning me-2"></i>
                                        売上管理
                                    </h1>
                                    <div class="d-flex gap-2">
                                        <a class="btn btn-info btn-sm" href="/reports/sales">
                                            <i class="fas fa-download"></i> レポート・エクスポート
                                        </a>
                                    </div>
                                </div>
                                <!-- Stats Cards -->
                                <div class="row mb-4">
                                    <div class="col-md-3">
                                        <div class="card bg-light border-0 text-center">
                                            <div class="card-body py-3">
                                                <h6 class="text-muted mb-2">本日の売上</h6>
                                                <h5 class="mb-0 text-primary">
                                                    ¥<span th:text="${#numbers.formatInteger(stats.totalAmount, 1, 'COMMA')}"></span>
                                                </h5>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="card bg-light border-0 text-center">
                                            <div class="card-body py-3">
                                                <h6 class="text-muted mb-2">本日の取引数</h6>
                                                <h5 class="mb-0 text-info">
                                                    <span th:text="${stats.salesCount}"></span>件
                                                </h5>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="card bg-light border-0 text-center">
                                            <div class="card-body py-3">
                                                <h6 class="text-muted mb-2">平均単価</h6>
                                                <h5 class="mb-0 text-warning">
                                                    ¥<span th:text="${#numbers.formatInteger(stats.averageAmount, 1, 'COMMA')}"></span>
                                                </h5>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="card bg-light border-0 text-center">
                                            <div class="card-body py-3">
                                                <h6 class="text-muted mb-2">前日比</h6>
                                                <h5 class="mb-0" th:if="${stats.changeRatio == null}">
                                                    <span class="text-muted">-</span>
                                                </h5>
                                                <h5 class="mb-0"
                                                    th:if="${stats.changeRatio != null}"
                                                    th:classappend="${stats.changeRatio >= 0} ? 'text-success' : 'text-danger'">
                                                    <span th:text="${(stats.changeRatio >= 0 ? '+' : '') + #numbers.formatDecimal(stats.changeRatio * 100, 1, 1)}"></span>%
                                                </h5>
                                                <small class="text-muted">
                                                    前日 ¥<span th:text="${#numbers.formatInteger(stats.previousAmount, 1, 'COMMA')}"></span>
                                                </small>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="table-responsive">
                                    <table id="content" class="table table-striped table-hover" data-datatable>
                                        <thead>
                                            <tr>
                                                <th>取引ID</th>
                                                <th>店舗</th>
                                                <th>数量</th>
                                                <th>合計金額</th>
                                                <th>受取金額</th>
                                                <th>お釣り</th>
                                                <th>日時</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="sale: ${data}">
                                                <td style="font-weight: 500;">
                                                    <a th:href="@{/sales/{id}(id=${sale.id})}">
                                                        #<span th:text="${sale.id}"></span>
                                                    </a>
                                                </td>
                                                <td>
                                                    <span class="badge bg-primary"
                                                          th:text="${storeNames.containsKey(sale.storeId)} ? ${storeNames.get(sale.storeId)} : ${'店舗' + sale.storeId}"></span>
                                                </td>
                                                <td style="text-align: center;">
                                                    <strong th:text="${sale.quantity}"></strong>
                                                </td>
                                                <td>
                                                    <strong style="font-size: 1.1rem; color: #000;">
                                                        ¥<span th:text="${#numbers.formatInteger(sale.amount, 1, 'COMMA')}"></span>
                                                    </strong>
                                                </td>
                                                <td>
                                                    <strong style="color: #059669;">
                                                        ¥<span th:text="${#numbers.formatInteger(sale.deposit, 1, 'COMMA')}"></span>
                                                    </strong>
                                                </td>
                                                <td>
                                                    <span style="color: #6b7280;">
                                                        ¥<span th:text="${#numbers.formatInteger(sale.deposit - sale.amount, 1, 'COMMA')}"></span>
                                                    </span>
                                                </td>
                                                <td>
                                                    <span th:if="${sale.createdAt != null}"
                                                          th:text="${#dates.format(sale.createdAt, 'yyyy/MM/dd HH:mm')}"></span>
                                                    <span th:if="${sale.createdAt == null}" class="text-muted">-</span>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <div class="mt-3">
                                    <a class="btn btn-secondary" href="/">
                                        <i class="fas fa-arrow-left"></i> 戻る
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout::footer}"></div>
</body>
</html>
