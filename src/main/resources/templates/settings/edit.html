<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout::base_header(${title})}"></head>
<body>
<nav th:replace="~{layout::nav('settings')}"></nav>
<main class="container">
    <div class="page-header">
        <h1>設定編集</h1>
    </div>

    <div class="row">
        <div class="col-12 col-md-8 col-lg-6 mx-auto">
            <div class="card">
                <div class="card-body">
                    <form th:action="@{/settings/{key}(key=${setting.key})}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="settingKey">設定項目</label>
                            <input class="form-control" id="settingKey" name="key" type="text"
                                   th:value="${setting.key}" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="settingValue">値</label>
                            <input class="form-control" id="settingValue" name="value" type="text"
                                   th:value="${setting.value}" required>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-primary" type="submit">更新</button>
                            <a class="btn btn-outline-secondary" href="/settings">一覧へ戻る</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{layout::footer}"></footer>
</body>
</html>
