<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout::base_header('売上レポート')}"></head>
<body>
<nav th:replace="~{layout::nav('reports')}"></nav>
<main class="container">
    <div class="page-header">
        <div>
            <h1>売上レポート</h1>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            <h2 class="h5 mb-0">期間指定レポート</h2>
        </div>
        <div class="card-body">
            <form id="dateRangeForm">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="startDate" class="form-label">開始日</label>
                        <input type="date" class="form-control" id="startDate" required>
                    </div>
                    <div class="col-md-3">
                        <label for="endDate" class="form-label">終了日</label>
                        <input type="date" class="form-control" id="endDate" required>
                    </div>
                    <div class="col-md-3">
                        <label for="storeId" class="form-label">店舗</label>
                        <select class="form-select" id="storeId">
                            <option value="">全店舗</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <div class="btn-group w-100" role="group">
                            <button type="button" class="btn btn-primary btn-sm" onclick="loadSummary()">集計</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="downloadReport('pdf', 'range')">PDF</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="downloadReport('excel', 'range')">Excel</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h2 class="h5 mb-0">集計結果</h2>
            <small class="text-muted" id="summaryPeriod">-</small>
        </div>
        <div class="card-body">
            <div id="summaryLoading" class="text-center text-muted py-3">読み込み中...</div>
            <div id="summaryError" class="alert alert-danger d-none" role="alert"></div>
            <div id="summaryBody" class="d-none">
                <div class="row g-3 mb-4">
                    <div class="col-6 col-lg-3">
                        <div class="border rounded p-3 h-100">
                            <div class="text-muted small">総売上金額</div>
                            <div class="fs-3 fw-bold" id="statTotalAmount">-</div>
                        </div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <div class="border rounded p-3 h-100">
                            <div class="text-muted small">取引件数</div>
                            <div class="fs-3 fw-bold" id="statTotalSales">-</div>
                        </div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <div class="border rounded p-3 h-100">
                            <div class="text-muted small">販売点数</div>
                            <div class="fs-3 fw-bold" id="statTotalItemCount">-</div>
                        </div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <div class="border rounded p-3 h-100">
                            <div class="text-muted small">平均客単価</div>
                            <div class="fs-3 fw-bold" id="statAverageAmount">-</div>
                        </div>
                    </div>
                </div>

                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabDaily" type="button" role="tab">日別</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabItems" type="button" role="tab">商品別</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabStores" type="button" role="tab">店舗別</button>
                    </li>
                </ul>
                <div class="tab-content pt-3">
                    <div class="tab-pane fade show active" id="tabDaily" role="tabpanel">
                        <div class="table-responsive">
                            <table class="table table-sm table-striped align-middle">
                                <thead>
                                <tr>
                                    <th>日付</th>
                                    <th class="text-end">件数</th>
                                    <th class="text-end">点数</th>
                                    <th class="text-end">売上金額</th>
                                </tr>
                                </thead>
                                <tbody id="dailyBody"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="tabItems" role="tabpanel">
                        <div class="table-responsive">
                            <table class="table table-sm table-striped align-middle">
                                <thead>
                                <tr>
                                    <th>商品名</th>
                                    <th class="text-end">単価</th>
                                    <th class="text-end">販売数</th>
                                    <th class="text-end">売上金額</th>
                                </tr>
                                </thead>
                                <tbody id="itemsBody"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="tabStores" role="tabpanel">
                        <div class="table-responsive">
                            <table class="table table-sm table-striped align-middle">
                                <thead>
                                <tr>
                                    <th>店舗名</th>
                                    <th class="text-end">件数</th>
                                    <th class="text-end">点数</th>
                                    <th class="text-end">売上金額</th>
                                </tr>
                                </thead>
                                <tbody id="storesBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            <h2 class="h5 mb-0">本日のレポート</h2>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="todayStoreId" class="form-label">店舗</label>
                    <select class="form-select" id="todayStoreId">
                        <option value="">全店舗</option>
                    </select>
                </div>
                <div class="col-md-6 d-flex align-items-end">
                    <div class="btn-group w-100" role="group">
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="downloadReport('pdf', 'today')">PDF</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="downloadReport('excel', 'today')">Excel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            <h2 class="h5 mb-0">月次レポート</h2>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="year" class="form-label">年</label>
                    <select class="form-select" id="year">
                        <!-- 年のオプションはJavaScriptで生成 -->
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="month" class="form-label">月</label>
                    <select class="form-select" id="month">
                        <option value="1">1月</option>
                        <option value="2">2月</option>
                        <option value="3">3月</option>
                        <option value="4">4月</option>
                        <option value="5">5月</option>
                        <option value="6">6月</option>
                        <option value="7">7月</option>
                        <option value="8">8月</option>
                        <option value="9">9月</option>
                        <option value="10">10月</option>
                        <option value="11">11月</option>
                        <option value="12">12月</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="monthlyStoreId" class="form-label">店舗</label>
                    <select class="form-select" id="monthlyStoreId">
                        <option value="">全店舗</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <div class="btn-group w-100" role="group">
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="downloadReport('pdf', 'monthly')">PDF</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="downloadReport('excel', 'monthly')">Excel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a class="btn btn-outline-secondary" href="/">戻る</a>
    </div>
</main>
<footer th:replace="~{layout::footer}"></footer>
<script>
/*<![CDATA[*/
    // ページ読み込み時の初期化
    document.addEventListener('DOMContentLoaded', function() {
        // 現在の日付を設定
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');

        document.getElementById('endDate').value = `${yyyy}-${mm}-${dd}`;
        document.getElementById('startDate').value = `${yyyy}-${mm}-01`;

        // 年のオプションを生成
        const yearSelect = document.getElementById('year');
        const currentYear = new Date().getFullYear();
        for (let year = currentYear; year >= currentYear - 5; year--) {
            const option = document.createElement('option');
            option.value = year;
            option.text = year + '年';
            if (year === currentYear) {
                option.selected = true;
            }
            yearSelect.appendChild(option);
        }

        // 現在の月を選択
        document.getElementById('month').value = today.getMonth() + 1;

        // 店舗リストを取得
        loadStores();

        ['startDate', 'endDate', 'storeId'].forEach(function(id) {
            document.getElementById(id).addEventListener('change', loadSummary);
        });

        loadSummary();
    });

    const yenFormatter = new Intl.NumberFormat('ja-JP');

    function yen(value) {
        return '¥' + yenFormatter.format(value);
    }

    function loadSummary() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const storeId = document.getElementById('storeId').value;

        const loading = document.getElementById('summaryLoading');
        const error = document.getElementById('summaryError');
        const body = document.getElementById('summaryBody');

        if (!startDate || !endDate) {
            return;
        }

        loading.classList.remove('d-none');
        error.classList.add('d-none');
        body.classList.add('d-none');

        const params = new URLSearchParams();
        params.append('startDate', startDate);
        params.append('endDate', endDate);
        if (storeId) params.append('storeId', storeId);

        fetch('/api/reports/sales/summary?' + params.toString())
            .then(response => {
                if (!response.ok) {
                    throw new Error('集計の取得に失敗しました (' + response.status + ')');
                }
                return response.json();
            })
            .then(summary => {
                renderSummary(summary, startDate, endDate);
                loading.classList.add('d-none');
                body.classList.remove('d-none');
            })
            .catch(e => {
                loading.classList.add('d-none');
                error.textContent = e.message;
                error.classList.remove('d-none');
            });
    }

    function renderSummary(summary, startDate, endDate) {
        document.getElementById('summaryPeriod').textContent = startDate + ' ～ ' + endDate;
        document.getElementById('statTotalAmount').textContent = yen(summary.totalAmount);
        document.getElementById('statTotalSales').textContent = yenFormatter.format(summary.totalSales) + ' 件';
        document.getElementById('statTotalItemCount').textContent = yenFormatter.format(summary.totalItemCount) + ' 点';
        document.getElementById('statAverageAmount').textContent = yen(summary.averageAmount);

        renderRows('dailyBody', summary.daily, 4, function(row) {
            return [row.date, yenFormatter.format(row.salesCount), yenFormatter.format(row.itemCount), yen(row.amount)];
        });
        renderRows('itemsBody', summary.items, 4, function(row) {
            return [row.itemName, yen(row.unitPrice), yenFormatter.format(row.quantity), yen(row.amount)];
        });
        renderRows('storesBody', summary.stores, 4, function(row) {
            return [row.storeName, yenFormatter.format(row.salesCount), yenFormatter.format(row.itemCount), yen(row.amount)];
        });
    }

    function renderRows(tbodyId, rows, columnCount, toCells) {
        const tbody = document.getElementById(tbodyId);
        tbody.textContent = '';

        if (!rows || rows.length === 0) {
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            td.colSpan = columnCount;
            td.className = 'text-center text-muted';
            td.textContent = '対象期間のデータはありません';
            tr.appendChild(td);
            tbody.appendChild(tr);
            return;
        }

        rows.forEach(function(row) {
            const tr = document.createElement('tr');
            toCells(row).forEach(function(value, index) {
                const td = document.createElement('td');
                if (index > 0) {
                    td.className = 'text-end';
                }
                td.textContent = value;
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    // 店舗リストを取得
    function loadStores() {
        fetch('/api/stores')
            .then(response => response.json())
            .then(stores => {
                const storeSelects = ['storeId', 'todayStoreId', 'monthlyStoreId'];
                storeSelects.forEach(selectId => {
                    const select = document.getElementById(selectId);
                    stores.forEach(store => {
                        const option = document.createElement('option');
                        option.value = store.id;
                        option.text = store.name;
                        select.appendChild(option);
                    });
                });
            })
            .catch(error => {
                console.error('店舗リストの取得に失敗しました:', error);
            });
    }

    // レポートダウンロード
    function downloadReport(format, type) {
        let url = '';
        let params = new URLSearchParams();

        if (type === 'range') {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const storeId = document.getElementById('storeId').value;

            if (!startDate || !endDate) {
                alert('開始日と終了日を選択してください。');
                return;
            }

            url = `/api/reports/sales/${format}`;
            params.append('startDate', startDate);
            params.append('endDate', endDate);
            if (storeId) params.append('storeId', storeId);

        } else if (type === 'today') {
            const storeId = document.getElementById('todayStoreId').value;
            url = `/api/reports/sales/${format}/today`;
            if (storeId) params.append('storeId', storeId);

        } else if (type === 'monthly') {
            const year = document.getElementById('year').value;
            const month = document.getElementById('month').value;
            const storeId = document.getElementById('monthlyStoreId').value;

            url = `/api/reports/sales/${format}/month`;
            params.append('year', year);
            params.append('month', month);
            if (storeId) params.append('storeId', storeId);
        }

        // ダウンロード実行
        const fullUrl = params.toString() ? `${url}?${params}` : url;
        window.open(fullUrl, '_blank');
    }
/*]]>*/
</script>
</body>
</html>
