<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="base_header(title)">
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title th:text="${title + ' - KidsPOS'}"></title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/datatables/dataTables.bootstrap5.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}" defer></script>
    <script th:src="@{/js/admin.js}" defer></script>
</head>
<body>
    <nav th:fragment="nav(active)" class="navbar navbar-expand-lg">
        <div class="container-fluid px-3">
            <a class="navbar-brand" href="/">KidsPOS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#globalNav" aria-controls="globalNav"
                    aria-expanded="false" aria-label="メニューを開く">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="globalNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'top'} ? 'active fw-bold'" href="/">ダッシュボード</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'items'} ? 'active fw-bold'" href="/items">商品</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'stores'} ? 'active fw-bold'" href="/stores">店舗</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'sales'} ? 'active fw-bold'" href="/sales">売上</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'reports'} ? 'active fw-bold'" href="/reports/sales">レポート</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'apk'} ? 'active fw-bold'" href="/apk">APK</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'logs'} ? 'active fw-bold'" href="/logs">ログ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'ip'} ? 'active fw-bold'" href="/ip">接続情報</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'settings'} ? 'active fw-bold'" href="/settings">設定</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <footer th:fragment="footer">
        KidsPOS System /
        <a href="/THIRD_PARTY_LICENSES.md" target="_blank">オープンソースライセンス</a>
    </footer>

    <th:block th:fragment="table_scripts">
        <script th:src="@{/vendor/jquery/jquery-3.7.0.min.js}"></script>
        <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
        <script th:src="@{/vendor/datatables/dataTables.bootstrap5.min.js}"></script>
    </th:block>

    <th:block th:fragment="qrcode_scripts">
        <script th:src="@{/QrCode/js/qrcode.min.js}"></script>
    </th:block>
</body>
</html>
