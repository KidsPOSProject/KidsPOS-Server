<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="base_header(title)">
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" name="viewport">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#667eea">
    <title th:text="${title + ' - KidsPOS'}"></title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" th:href="@{/vendor/font-awesome/all.min.css}">

    <!-- Google Fonts -->
    <link rel="stylesheet" th:href="@{/vendor/fonts/inter.css}">

    <!-- DataTables CSS -->
    <link rel="stylesheet" th:href="@{/vendor/datatables/dataTables.bootstrap5.min.css}">

    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" th:href="@{/vendor/sweetalert2/sweetalert2.min.css}">

    <!-- Modern Custom Styles -->
    <link rel="stylesheet" th:href="@{/css/modern-style.css}">

    <!-- Mobile Responsive Styles -->
    <link rel="stylesheet" th:href="@{/css/mobile-responsive.css}">
    
    <!-- jQuery -->
    <script th:src="@{/vendor/jquery/jquery-3.7.0.min.js}"></script>

    <!-- Bootstrap 5 JS -->
    <script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>

    <!-- DataTables JS -->
    <script th:src="@{/vendor/datatables/jquery.dataTables.min.js}"></script>
    <script th:src="@{/vendor/datatables/dataTables.bootstrap5.min.js}"></script>

    <!-- QR Code Generator -->
    <script th:src="@{/QrCode/js/qrcode.min.js}"></script>

    <!-- SweetAlert2 for modern alerts -->
    <script th:src="@{/vendor/sweetalert2/sweetalert2.min.js}"></script>

    <!-- Chart.js for data visualization -->
    <script th:src="@{/vendor/chartjs/chart.umd.min.js}"></script>

    <!-- Custom Scripts -->
    <script th:src="@{/js/modern-scripts.js}" defer></script>
</head>
<body>
    <!-- Navigation Fragment -->
    <nav th:fragment="nav(active)" class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <div class="container-fluid px-3">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store"></i> KidsPOS
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#globalNav" aria-controls="globalNav"
                    aria-expanded="false" aria-label="メニューを開く">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="globalNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'top'} ? 'active fw-bold'" href="/">
                            <i class="fas fa-home"></i> ダッシュボード
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'items'} ? 'active fw-bold'" href="/items">
                            <i class="fas fa-box"></i> 商品
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'stores'} ? 'active fw-bold'" href="/stores">
                            <i class="fas fa-store-alt"></i> 店舗
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'sales'} ? 'active fw-bold'" href="/sales">
                            <i class="fas fa-chart-line"></i> 売上
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'reports'} ? 'active fw-bold'" href="/reports/sales">
                            <i class="fas fa-file-pdf"></i> レポート
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'apk'} ? 'active fw-bold'" href="/apk">
                            <i class="fas fa-mobile-alt"></i> APK
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'logs'} ? 'active fw-bold'" href="/logs">
                            <i class="fas fa-clipboard-list"></i> ログ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'ip'} ? 'active fw-bold'" href="/ip">
                            <i class="fas fa-network-wired"></i> 接続情報
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'settings'} ? 'active fw-bold'" href="/settings">
                            <i class="fas fa-cog"></i> 設定
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Footer Fragment -->
    <footer th:fragment="footer" class="footer mt-auto py-3 bg-light">
        <div class="container text-center">
            <p class="text-muted mb-1">
                <small>
                    KidsPOS System - Built with
                    <a href="/THIRD_PARTY_LICENSES.md" target="_blank" class="text-decoration-none">Open Source Software</a>
                </small>
            </p>
            <p class="text-muted mb-0">
                <small>
                    Icons by <a href="https://fontawesome.com" target="_blank" rel="noopener noreferrer" class="text-decoration-none">Font Awesome</a> |
                    Fonts by <a href="https://rsms.me/inter/" target="_blank" rel="noopener noreferrer" class="text-decoration-none">Inter Project</a>
                </small>
            </p>
        </div>
    </footer>
</body>
</html>
