<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout::base_header(${title})}"></head>
<body>
<nav th:replace="~{layout::nav('stores')}"></nav>
<main class="container">
    <div class="page-header">
        <div>
            <h1>店舗管理</h1>
            <p>店舗情報の登録・編集</p>
        </div>
        <a href="/stores/new" class="btn btn-primary">新規作成</a>
    </div>

    <div class="table-responsive">
        <table id="content" class="table table-striped table-hover" data-datatable>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>店名</th>
                    <th>プリンタ</th>
                    <th class="no-sort" width="180">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="store: ${data}">
                    <td th:text="${store.id}"></td>
                    <td>
                        <strong th:text="${store.name}"></strong>
                    </td>
                    <td>
                        <code th:text="${store.printerUri}"></code>
                    </td>
                    <td>
                        <div class="d-flex gap-2">
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/stores/{id}/edit(id=${store.id})}">編集</a>
                            <form th:action="@{/stores/{id}/delete(id=${store.id})}" method="post"
                                  th:data-confirm-delete="${store.name}" class="d-inline">
                                <button type="submit" class="btn btn-outline-danger btn-sm">削除</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <a class="btn btn-outline-secondary" href="/">戻る</a>
    </div>
</main>
<footer th:replace="~{layout::footer}"></footer>
<th:block th:replace="~{layout::table_scripts}"></th:block>
</body>
</html>
