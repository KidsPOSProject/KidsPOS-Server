<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout::base_header(${title})}"></head>
<body>
<nav th:replace="~{layout::nav('ip')}"></nav>
<main class="container">
    <div class="page-header">
        <div>
            <h1>ネットワーク情報</h1>
            <p>システムのIPアドレスとQRコードアクセス</p>
        </div>
    </div>

    <div class="row">
        <div th:each="host: ${hosts}" class="col-md-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 mb-3" th:text="${host.name}"></h2>

                    <div class="row">
                        <div class="col-6">
                            <h3 class="h6 text-muted mb-2">ホスト名</h3>
                            <p class="mb-3">
                                <code th:text="${host.name}"></code>
                            </p>
                            <div class="text-center">
                                <div th:id="${host.nameId}" class="qr-code"></div>
                                <p class="small text-muted mt-2">
                                    http://<span th:text="${host.name}"></span>:<span th:text="${port}"></span>
                                </p>
                            </div>
                        </div>

                        <div class="col-6">
                            <h3 class="h6 text-muted mb-2">IPアドレス</h3>
                            <p class="mb-3">
                                <code th:text="${host.address}"></code>
                            </p>
                            <div class="text-center">
                                <div th:id="${host.addressId}" class="qr-code"></div>
                                <p class="small text-muted mt-2">
                                    http://<span th:text="${host.address}"></span>:<span th:text="${port}"></span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a class="btn btn-outline-secondary" href="/">戻る</a>
    </div>
</main>
<footer th:replace="~{layout::footer}"></footer>
<th:block th:replace="~{layout::qrcode_scripts}"></th:block>
<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function() {
        /*[# th:each="host : ${hosts}"]*/
        new QRCode(document.getElementById('[(${host.nameId})]'), {
            text: 'http://[(${host.name})]:[(${port})]',
            width: 160,
            height: 160,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
        new QRCode(document.getElementById('[(${host.addressId})]'), {
            text: 'http://[(${host.address})]:[(${port})]',
            width: 160,
            height: 160,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
        /*[/]*/
    });
    /*]]>*/
</script>
</body>
</html>
